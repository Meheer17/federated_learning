name: federated_chat
description: "A Privacy-First AI Chat Assistant with On-Device Learning & Federated Learning"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  flutter_chat_ui: ^1.6.10
  flutter_chat_types: ^3.6.2
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Storage & Crypto
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3

  # Networking & Utilities
  dio: ^5.4.3
  workmanager: ^0.5.2
  uuid: ^4.4.0
  ffi: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
