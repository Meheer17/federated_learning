[project]
name = "fedchat-server"
version = "0.1.0"
description = "Privacy-First Federated Learning Orchestrator Server for FedChat"
authors = [{ name = "FedChat Team" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "flwr[simulation]>=1.8.0",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "torch>=2.3.1",
    "opacus>=1.4.1",
    "numpy>=1.26.4",
    "mlflow>=2.14.1",
    "celery[redis]>=5.4.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
