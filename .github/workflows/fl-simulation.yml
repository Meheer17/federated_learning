name: FL Simulation CI

on:
  push:
    branches: [ main ]

jobs:
  run-simulation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch flwr fastapi pydantic pydantic-settings

      - name: Run Federated Learning Simulation
        run: |
          PYTHONPATH=. python3 server/simulation/run_simulation.py
