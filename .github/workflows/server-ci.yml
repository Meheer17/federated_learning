name: Server CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch flwr fastapi pydantic pydantic-settings pytest pytest-cov

      - name: Run server aggregation unit tests
        run: |
          PYTHONPATH=. python3 -c "from server.tests.test_aggregation import test_fedavg_weighted_math, test_secagg_mask_cancellation; test_fedavg_weighted_math(); test_secagg_mask_cancellation(); print('Server tests passed!')"
